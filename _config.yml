# Hexo Configuration
# Docs: https://hexo.io/docs/configuration.html

# Site
title: fe1fan 的博客
subtitle: 记录开发、产品与日常
description: 使用 Hexo 与 Shiro 主题搭建的个人博客，部署在 GitHub Pages。
keywords:
  - Hexo
  - GitHub Pages
  - Blog
  - Shiro
author: fe1fan
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://fe1fan.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page
index_generator:
  path: ''
  per_page: 8
  order_by: -date

# Category & Tag
default_category: 随笔
category_map:
tag_map:

# Metadata
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 8
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: shiro

# Deployment
deploy:
  type: ''
